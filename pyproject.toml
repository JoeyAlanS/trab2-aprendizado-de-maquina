[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enem-base"
version = "0.1.0"
description = "Estudo reproduzível da nota de Ciências da Natureza do ENEM 2023"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pandas>=2.2,<4",
  "pyarrow>=19,<25",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "threadpoolctl>=3.5,<4",
  "streamlit>=1.66,<2",
  "plotly>=6.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
enem-base = "enem_base.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
